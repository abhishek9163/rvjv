{% extends 'base.html' %}
{% block content %}
<div style="max-width: 520px; margin: 0 auto; padding: 1rem;">
    <div class="card" style="padding: 0; overflow: hidden; border-radius: 16px;">
        <div style="background: linear-gradient(135deg, var(--primary), #0ea5e9); padding: 2rem; text-align: center;">
            <div style="width: 60px; height: 60px; border-radius: 50%; background: rgba(255,255,255,0.2); display: flex; align-items: center; justify-content: center; font-size: 1.8rem; margin: 0 auto 1rem;">🔑</div>
            <h2 style="color: white; font-size: 1.4rem; font-weight: 700; margin: 0;">Change Password</h2>
            <p style="color: rgba(255,255,255,0.8); margin: 0.5rem 0 0; font-size: 0.9rem;">Update your account password</p>
        </div>

        <div style="padding: 2rem;">
            <form method="POST">
                {% csrf_token %}

                <div class="form-group">
                    <label style="font-weight: 600; font-size: 0.875rem; color: var(--text-secondary);">Current Password</label>
                    <input type="password" name="old_password" class="form-control" required placeholder="Enter your current password" style="margin-top: 0.4rem;">
                </div>

                <div class="form-group">
                    <label style="font-weight: 600; font-size: 0.875rem; color: var(--text-secondary);">New Password</label>
                    <input type="password" name="new_password" class="form-control" required placeholder="Minimum 6 characters" style="margin-top: 0.4rem;">
                </div>

                <div class="form-group" style="margin-bottom: 1.75rem;">
                    <label style="font-weight: 600; font-size: 0.875rem; color: var(--text-secondary);">Confirm New Password</label>
                    <input type="password" name="confirm_password" class="form-control" required placeholder="Re-enter new password" style="margin-top: 0.4rem;">
                </div>

                <div style="display: flex; gap: 1rem;">
                    <button type="submit" class="btn btn-primary" style="flex: 1; padding: 0.8rem;">🔑 Update Password</button>
                    <a href="{% url 'my_profile' %}" class="btn btn-outline" style="flex: 1; padding: 0.8rem; text-align: center;">Cancel</a>
                </div>
            </form>
        </div>
    </div>
</div>
{% endblock %}
